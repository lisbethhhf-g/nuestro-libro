<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💙 Nuestro Libro 💙</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/portada.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="container-portada">
        <div class="ornament">🌙 ✦ ✦ ✦</div>
        
        <h1>Pequeña Historia</h1>
        <div class="divider-line"></div>
        <p class="subtitle">"Es un poquito de nosotros, pero es lo que nos hace vivir y crecer"</p>

        <div class="cover-question">
            💙 ¿Estás listo para ver algo muy especial? 💙
        </div>

        <div class="cover-buttons">
            <button class="cover-btn yes-btn" onclick="abrirLibro()">Sí, quiero verlo 💙</button>
            <button class="cover-btn no-btn" id="noBtn" onclick="noAbrirLibro()">Aún no 🥺</button>
        </div>
        
        <div class="footer-note">✦ Hecho con amor infinito ✦</div>
    </div>

    <!-- Scripts -->
    <script src="js/portada.js"></script>
</body>
</html>
